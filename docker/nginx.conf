events {
  worker_connections 1024;
}
 
http {
  # Round-robin across all app instances by default.
  # ip_hash would pin a client to one instance — not needed here since
  # WebSocket connections stay open on whichever instance they were
  # upgraded on; Nginx doesn't need to re-route mid-connection.
  upstream wsaksham_backend {
    server app1:3000;
    server app2:3000;
    server app3:3000;
  }
 
  server {
    listen 80;
 
    location / {
      proxy_pass http://wsaksham_backend;
      proxy_http_version 1.1;
 
      # Required for WebSocket upgrade to work through the proxy
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
 
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
 
      proxy_read_timeout 3600s;
    }
  }
}