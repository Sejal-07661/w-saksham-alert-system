services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: wsaksham_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/wsaksham_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: yourpassword
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: changeme_dev_only
    depends_on:
      - mongo
      - redis
      - rabbitmq

  redis:
    image: redis:7-alpine
    container_name: wsaksham_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass yourpassword

  rabbitmq:
    image: rabbitmq:3-management
    container_name: wsaksham_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  mongo:
    image: mongo:7
    container_name: wsaksham_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"