name: Test and Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Debug key fingerprint
        run: |
          echo "Key line count:"
          wc -l ~/.ssh/deploy_key
          echo "Key fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key
          echo "Target host and user:"
          echo "HOST=[${{ secrets.EC2_HOST }}]"
          echo "USER=[${{ secrets.EC2_USER }}]"

      - name: Deploy to EC2
        run: |
          ssh -v -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd ${{ secrets.EC2_APP_DIR }} &&
            git pull origin main &&
            npm ci &&
            npm run build &&
            pm2 restart wsaksham
          "