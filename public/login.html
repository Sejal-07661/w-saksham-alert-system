<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>W-Saksham — Sign in</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #14171A;
    color: #E8E6E1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .panel {
    width: 100%;
    max-width: 380px;
    background: #1E2226;
    border: 1px solid #2A2F34;
    border-radius: 10px;
    padding: 32px;
  }
  .eyebrow {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: #2FA98C;
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 24px;
    color: #E8E6E1;
  }
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    background: #14171A;
    border-radius: 8px;
    padding: 4px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 8px 0;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    color: #8A8F94;
    transition: background 0.15s, color 0.15s;
  }
  .tab.active {
    background: #2A2F34;
    color: #E8E6E1;
  }
  label {
    display: block;
    font-size: 12px;
    color: #8A8F94;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    background: #14171A;
    border: 1px solid #2A2F34;
    border-radius: 6px;
    color: #E8E6E1;
    font-size: 14px;
    outline: none;
  }
  input:focus {
    border-color: #2FA98C;
  }
  button.submit {
    width: 100%;
    margin-top: 22px;
    padding: 11px 0;
    background: #2FA98C;
    color: #0B1210;
    font-weight: 600;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button.submit:hover { background: #38C2A2; }
  .msg {
    margin-top: 14px;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 6px;
    display: none;
  }
  .msg.error { display: block; background: rgba(232,89,60,0.12); color: #E8593C; }
  .msg.ok { display: block; background: rgba(47,169,140,0.12); color: #2FA98C; }
</style>
</head>
<body>
  <div class="panel">
    <p class="eyebrow">W-Saksham — women's safety</p>
    <h1>Sign in to send an SOS</h1>

    <div class="tabs">
      <div class="tab active" id="tab-login">Sign in</div>
      <div class="tab" id="tab-register">Create account</div>
    </div>

    <form id="form">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button class="submit" type="submit" id="submit-btn">Sign in</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    let mode = 'login';

    function switchTab(next) {
      mode = next;
      document.getElementById('tab-login').classList.toggle('active', next === 'login');
      document.getElementById('tab-register').classList.toggle('active', next === 'register');
      document.getElementById('submit-btn').textContent = next === 'login' ? 'Sign in' : 'Create account';
      document.getElementById('msg').className = 'msg';
    }

    document.getElementById('tab-login').addEventListener('click', () => switchTab('login'));
    document.getElementById('tab-register').addEventListener('click', () => switchTab('register'));

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');
      msg.className = 'msg';

      const endpoint = mode === 'login' ? '/api/v1/auth/login' : '/api/v1/auth/register';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          let text = data.error || 'Something went wrong';
          if (data.details) {
            const fieldErrors = data.details.fieldErrors || {};
            const formErrors = data.details.formErrors || [];
            const parts = [];
            for (const key in fieldErrors) {
              if (fieldErrors[key] && fieldErrors[key].length) parts.push(`${key}: ${fieldErrors[key][0]}`);
            }
            if (formErrors.length) parts.push(...formErrors);
            if (parts.length) text = parts.join(' — ');
          }
          msg.textContent = text;
          msg.className = 'msg error';
          return;
        }

        sessionStorage.setItem('wsaksham_token', data.token);
        sessionStorage.setItem('wsaksham_username', username);
        window.location.href = '/dashboard.html';
      } catch (err) {
        msg.textContent = 'Could not reach the server';
        msg.className = 'msg error';
      }
    });
  </script>
</body>
</html>
