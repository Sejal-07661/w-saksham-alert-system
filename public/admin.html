<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>W-Saksham — Admin console</title>
<link rel="stylesheet" href="/style.css" />
<style>
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
    position: sticky;
    top: 0;
    z-index: 10;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark {
    width: 26px; height: 26px;
    border-radius: 6px;
    background: var(--signal-critical);
    display: flex; align-items: center; justify-content: center;
    color: #2A0B04; font-weight: 800; font-size: 13px;
  }
  .brand-name { font-size: 14.5px; font-weight: 700; }
  .admin-pill {
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--signal-critical-dim);
    color: var(--signal-critical);
    font-weight: 700;
  }
  .user-info { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 16px; }
  .username-pill {
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-primary);
  }
  .back-link { color: var(--text-muted); font-size: 13px; text-decoration: none; }
  .back-link:hover { color: var(--text-primary); }
  .signout { color: var(--signal-critical); cursor: pointer; font-size: 13px; font-weight: 500; }
  .signout:hover { text-decoration: underline; }

  main {
    max-width: 1320px;
    margin: 0 auto;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  @media (max-width: 640px) { main { padding: 14px; } }

  /* --- Stats row --- */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  @media (max-width: 860px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }
  .stat-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 18px;
  }
  .stat-card .num { font-family: var(--font-mono); font-size: 26px; font-weight: 700; color: var(--text-primary); }
  .stat-card .num.critical { color: var(--signal-critical); }
  .stat-card .lbl { font-size: 11.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }

  /* --- Layout: filters+table left, map right on wide, stacked on narrow --- */
  .work-area {
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 1080px) { .work-area { grid-template-columns: 1fr; } }

  /* --- Filters --- */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }
  .filter-bar select, .filter-bar input {
    width: auto;
    min-width: 120px;
  }
  .filter-bar input[type="text"] { flex: 1; min-width: 180px; }
  .filter-chip {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text-muted);
    cursor: pointer;
  }
  .filter-chip.active { border-color: var(--signal-safe); color: var(--signal-safe); background: var(--signal-safe-dim); }

  /* --- Alert table --- */
  .alert-table { width: 100%; border-collapse: collapse; }
  .alert-table th {
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  .alert-table td {
    padding: 12px 10px;
    border-bottom: 1px solid var(--border-soft);
    font-size: 13px;
    vertical-align: top;
  }
  .alert-table tr:last-child td { border-bottom: none; }
  .alert-table tr:hover td { background: var(--bg-panel-alt); }
  .cell-title { font-weight: 600; margin-bottom: 3px; }
  .cell-desc { color: var(--text-muted); font-size: 12px; line-height: 1.5; max-width: 320px; }
  .cell-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); }
  .status-select {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 8px;
    width: auto;
    min-width: 130px;
  }
  .risk-score { font-family: var(--font-mono); font-size: 12px; }
  .risk-score.high { color: var(--signal-critical); }

  .table-wrap { overflow-x: auto; }

  .map-side iframe { width: 100%; height: 560px; border: none; display: block; border-radius: var(--radius-sm); }
  @media (max-width: 1080px) { .map-side iframe { height: 380px; } }

  .empty { font-size: 13px; color: var(--text-faint); padding: 32px 0; text-align: center; }
  .loading-row td { padding: 10px; }
</style>
</head>
<body class="console-surface">
<header>
  <div class="brand">
    <span class="mark">W</span>
    <span class="brand-name">W-Saksham Admin</span>
    <span class="admin-pill">Responder view</span>
  </div>
  <div class="user-info">
    <a class="back-link" href="/dashboard.html">← Dispatch console</a>
    <span class="username-pill" id="who"></span>
    <span class="signout" id="signout-btn">Sign out</span>
  </div>
</header>

<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<main>
  <div class="stats-row">
    <div class="stat-card"><div class="num" id="stat-total">—</div><div class="lbl">Total alerts</div></div>
    <div class="stat-card"><div class="num critical" id="stat-critical">—</div><div class="lbl">Critical severity</div></div>
    <div class="stat-card"><div class="num" id="stat-24h">—</div><div class="lbl">Last 24 hours</div></div>
    <div class="stat-card"><div class="num" id="stat-pending">—</div><div class="lbl">Awaiting response</div></div>
  </div>

  <div class="work-area">
    <div class="panel">
      <h2>Alert queue</h2>
      <div class="filter-bar" style="margin-top:16px;">
        <select id="filter-severity">
          <option value="">All severities</option>
          <option value="critical">Critical</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <select id="filter-status">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="acknowledged">Acknowledged</option>
          <option value="processing">Processing</option>
          <option value="escalated">Escalated</option>
          <option value="resolved">Resolved</option>
        </select>
        <select id="filter-category">
          <option value="">All categories</option>
          <option value="sos">SOS</option>
          <option value="harassment">Harassment</option>
          <option value="stalking">Stalking</option>
          <option value="unsafe_area">Unsafe area</option>
          <option value="medical">Medical</option>
          <option value="route_deviation">Route deviation</option>
          <option value="other">Other</option>
        </select>
        <input type="text" id="filter-search" placeholder="Search title, description, reporter…" />
      </div>

      <div class="table-wrap">
        <table class="alert-table">
          <thead>
            <tr>
              <th>Alert</th>
              <th>Category</th>
              <th>Risk</th>
              <th>Reported by</th>
              <th>Time</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="alert-tbody">
            <tr class="loading-row"><td colspan="6"><div class="skeleton" style="height:40px;"></div></td></tr>
          </tbody>
        </table>
        <div class="empty" id="empty-state" style="display:none;">No alerts match these filters.</div>
      </div>
    </div>

    <div class="panel map-side">
      <h2>Live map</h2>
      <div style="margin-top:14px;">
        <iframe src="/map.html" title="Live alert map"></iframe>
      </div>
    </div>
  </div>
</main>

<script>
  const token = sessionStorage.getItem('wsaksham_token');
  const username = sessionStorage.getItem('wsaksham_username');
  if (!token) window.location.href = '/login.html';
  document.getElementById('who').textContent = '@' + username;

  // Decode the JWT payload client-side to check role before even calling
  // the API — purely a UX nicety (redirect early instead of showing a
  // flash of "Forbidden"). The server-side requireRole check is the real
  // gate; this can't be trusted on its own since a client can forge it.
  function decodeJwtPayload(t) {
    try { return JSON.parse(atob(t.split('.')[1])); } catch (e) { return null; }
  }
  const payload = decodeJwtPayload(token);
  if (!payload || payload.role !== 'admin') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#8B9198;font-family:Inter,sans-serif;">' +
      '<h1 style="color:#ECEAE4;">Admin access required</h1>' +
      '<p>This account does not have responder permissions.</p>' +
      '<a href="/dashboard.html" style="color:#2FB88F;">← Back to dispatch console</a></div>';
    throw new Error('Not admin');
  }

  document.getElementById('signout-btn').addEventListener('click', () => {
    sessionStorage.removeItem('wsaksham_token');
    sessionStorage.removeItem('wsaksham_username');
    window.location.href = '/login.html';
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function toast(message, type = 'ok', timeoutMs = 4200) {
    const stack = document.getElementById('toast-stack');
    const el = document.createElement('div');
    el.className = `toast ${type === 'ok' ? '' : type}`;
    el.innerHTML = `<div class="toast-body">${escapeHtml(message)}</div><span class="toast-close" aria-label="Dismiss">×</span>`;
    stack.appendChild(el);
    const remove = () => { el.classList.add('leaving'); setTimeout(() => el.remove(), 180); };
    el.querySelector('.toast-close').addEventListener('click', remove);
    if (timeoutMs) setTimeout(remove, timeoutMs);
  }

  async function apiCall(method, url, body) {
    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  /* --- Stats --- */
  async function loadStats() {
    try {
      const stats = await apiCall('GET', '/api/v1/admin/stats');
      document.getElementById('stat-total').textContent = stats.total;
      document.getElementById('stat-critical').textContent = stats.critical;
      document.getElementById('stat-24h').textContent = stats.last24h;
      const pending = (stats.statusCounts.pending || 0) + (stats.statusCounts.acknowledged || 0);
      document.getElementById('stat-pending').textContent = pending;
    } catch (err) {
      toast('Could not load stats: ' + err.message, 'error');
    }
  }

  /* --- Alert table --- */
  const STATUS_OPTIONS = ['pending', 'acknowledged', 'processing', 'escalated', 'resolved'];

  function renderRow(a) {
    const sev = a.severity || 'medium';
    const time = a.createdAt ? new Date(a.createdAt).toLocaleString() : '';
    const risk = typeof a.riskScore === 'number' ? a.riskScore : null;
    const riskClass = risk !== null && risk >= 70 ? 'high' : '';
    const statusOptions = STATUS_OPTIONS.map(s =>
      `<option value="${s}" ${s === a.status ? 'selected' : ''}>${s}</option>`
    ).join('');

    return `
      <tr data-alert-id="${escapeHtml(a.alertId)}">
        <td>
          <div class="cell-title">${escapeHtml(a.title)} <span class="badge ${sev}">${sev}</span></div>
          <div class="cell-desc">${escapeHtml(a.description)}</div>
        </td>
        <td class="cell-meta">${escapeHtml((a.category || '').replace('_', ' '))}</td>
        <td class="risk-score ${riskClass}">${risk !== null ? risk : '—'}</td>
        <td class="cell-meta">${escapeHtml(a.reportedBy || '')}</td>
        <td class="cell-meta">${time}</td>
        <td>
          <select class="status-select" data-alert-id="${escapeHtml(a.alertId)}">
            ${statusOptions}
          </select>
        </td>
      </tr>`;
  }

  function currentFilters() {
    const params = new URLSearchParams();
    const severity = document.getElementById('filter-severity').value;
    const status = document.getElementById('filter-status').value;
    const category = document.getElementById('filter-category').value;
    const search = document.getElementById('filter-search').value.trim();
    if (severity) params.set('severity', severity);
    if (status) params.set('status', status);
    if (category) params.set('category', category);
    if (search) params.set('search', search);
    return params.toString();
  }

  async function loadAlerts() {
    const tbody = document.getElementById('alert-tbody');
    const empty = document.getElementById('empty-state');
    try {
      const query = currentFilters();
      const data = await apiCall('GET', `/api/v1/admin/alerts${query ? '?' + query : ''}`);
      if (!data.alerts.length) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      tbody.innerHTML = data.alerts.map(renderRow).join('');

      tbody.querySelectorAll('.status-select').forEach(select => {
        select.addEventListener('change', async (e) => {
          const alertId = e.target.getAttribute('data-alert-id');
          const newStatus = e.target.value;
          try {
            await apiCall('PATCH', `/api/v1/admin/alerts/${alertId}/status`, { status: newStatus });
            toast(`Status updated to "${newStatus}".`, 'ok');
            loadStats();
          } catch (err) {
            toast(err.message, 'error');
          }
        });
      });
    } catch (err) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      empty.textContent = 'Could not load alerts: ' + err.message;
      toast(err.message, 'error');
    }
  }

  ['filter-severity', 'filter-status', 'filter-category'].forEach(id => {
    document.getElementById(id).addEventListener('change', loadAlerts);
  });
  let searchDebounce;
  document.getElementById('filter-search').addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(loadAlerts, 350);
  });

  /* --- Live refresh via WebSocket (reuses the same broadcast every client gets) --- */
  function connectLive() {
    const socket = new WebSocket(`ws://${window.location.host}`);
    socket.onmessage = () => { loadAlerts(); loadStats(); };
  }

  loadStats();
  loadAlerts();
  connectLive();
</script>
</body>
</html>
